<html>
<head>
    <title>Eurofins Vietnam - Hủy đơn hàng - {mt_so_ct}</title>
	<style type="text/css">
		body{
			font-family: Times New Roman;
			font-size: 18px;
			color: black;
		}
		.tdata{
			border-collapse: collapse;
		}
		.tdata td{
			padding: 5px;
		}
		.tdata tr{
			min-height: 55px;
		}
        .rheader{
			background: rgb(235,245,255);
			font-weight: bold;
			text-align: center;
			height: 50px;
		}
		.cnumber{
			text-align: right;
		}
		.cdate{
			text-align: center;
		}
    </style>
</head>
<body>
	Khách hàng: {mt_ma_kh} - {mt_ten_kh}
	<br/>Chi tiết:
	<br/>
	<br/>
	<div>
        <table class="tdata" border="1">
            <tr class="rheader">
                <td style="width: 100px;">
                    Mã vật tư
                </td>
				<td style="width: 250px;">
                    Tên vật tư
                </td>
                <td style="width: 100px;">
                    Tiền
                </td>
				<td style="width: 100px;">
                    Ngày
                </td>
            </tr>
			<start1>
			<tr>
				<td>{dt1_ma_vt}</td>            
				<td>{dt1_ten_vt}</td> 
				<td class="cnumber">{dt1_tien}</td>
				<td class="cdate">{dt1_ngay}</td>  				
			</tr>
			<end1>		
        </table>
        <br />
        <table class="tdata" border="1">
            <tr class="rheader">
                <td style="width: 100px;">
                    Mã thuế
                </td>
                <td style="width: 250px;">
                    Tên thuế
                </td>
                <td style="width: 100px;">
                    Tiền thuế
                </td>
                <td style="width: 100px;">
                    Năm
                </td>
            </tr>
            <start2>
                <tr>
                    <td>{dt2_ma_thue}</td>
                    <td>{dt2_ten_thue}</td>
                    <td class="cnumber">{dt2_tien}</td>
                    <td class="cdate">{dt2_nam}</td>
                </tr>
            <end2>
        </table>
    </div>
</body>
</html>
